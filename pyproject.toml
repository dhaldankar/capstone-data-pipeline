[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mamaearth-capstone"
version = "0.1.0"
description = "Mamaearth returns and growth intelligence capstone"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<3", "matplotlib>=3.7,<4", "jinja2>=3.1,<4", "pydantic>=2.9,<3", "google-genai>=1.0,<3"]

[project.scripts]
capstone = "cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "analysis", "common", "narrator", "pipelines", "reporting"]

[tool.uv]
package = true
